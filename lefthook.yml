# Single git-hook runner for the repo (replaces the hand-rolled .githooks/).
# Wired automatically by `bun install` via the `prepare` script → `lefthook install`.
#
# Bypass everything:  LEFTHOOK=0 git …   or   git … --no-verify
# Per-gate bypass env vars are noted on each job below.
#
# `bun run doctor` asserts every job below still exists — deleting one fails CI
# instead of silently disarming the axiom it enforces.

pre-commit:
  piped: true # run in order, abort on first failure
  jobs:
    # lint-staged equivalent: auto-fix the staged files with Biome, then
    # re-stage them so the fixes land in the same commit (no second commit).
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # TDD gate: a change under apps/*/src/** must stage a *.test.ts / *.spec.ts.
    # Bypass: SKIP_TDD=1 git commit …
    - name: tdd-gate
      run: ./scripts/check-tests-touched.sh
    # The `_Avoid_` lists in every `## Domain` section. Staged-file scope here;
    # `bun run test` sweeps the whole tree, so a rename cannot smuggle one past.
    - name: vocabulary
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,md,mdx,sh,json,jsonc,yml,yaml}"
      run: bun run scripts/check-vocabulary.ts --staged {staged_files}

commit-msg:
  jobs:
    # Conventional commits: machine-readable history for changelogs, bisects and
    # agents summarizing the repo.
    - name: conventional-commit
      run: bun run scripts/check-commit-msg.ts {1}

pre-push:
  piped: true
  jobs:
    # Standing invariant: every apps/daemon/src/features/<feature>/ folder ships
    # at least one co-located test. Bypass: SKIP_FEATURE_TEST_FLOOR=1 git push …
    - name: feature-test-floor
      run: ./scripts/check-feature-tests.sh
    # Type gate over every workspace (discovery-based: a new app joins the gate
    # or breaks it — it cannot be silently skipped).
    - name: typecheck
      run: bun run typecheck
    # Ratchet on the axioms with legacy debt: new violations fail, repayments
    # must be recorded. See scripts/axiom-debt.core.ts.
    - name: axiom-debt
      run: bun run axiom-debt
    # Fast unit suites + the co-location and harness self-checks.
    - name: unit
      run: bun run test
    # Full Playwright e2e suite. Bypass: SKIP_E2E=1 git push …
    - name: e2e
      run: ./scripts/check-e2e.sh
