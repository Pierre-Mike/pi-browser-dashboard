name: Dependency advisories

# Known-vulnerability scan of the lockfile on main, on a clock.
#
# Every other dependency signal in this repo is event-driven: `fallow audit`,
# CodeQL and zizmor run on push and PR; Dependabot opens PRs weekly against
# whatever it can see. None of them scan a repo nobody is pushing to, and a new
# advisory is not an event in this repo — it is an event in the world. The
# template this harness came from went 2.5 quiet weeks and accumulated 16
# advisories (one critical) before a routine PR tripped over them. So the check
# belongs on a clock too.
#
# This job does NOT fail on an advisory. It opens — or refreshes — one deduped
# issue, and closes it when the scan comes back clean. Same reasoning as the
# `min-severity: high` note on the zizmor job in unit-tests.yml: a permanently
# red scheduled check teaches people to ignore it, which is worse than not
# having it. This repo has live advisories whose fixes need a major bump and
# `package.json` `overrides` entries — days of work, during which a red X would
# decay into wallpaper. An issue has an owner, a body that stays current, and a
# close condition; a red cron badge has none of those.
#
# The run fails only when the SCAN fails, which is actionable the same day.
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-advisories
  cancel-in-progress: false

jobs:
  # Deliberately NOT one of the four job names the branch ruleset pins as
  # required status checks (see CLAUDE.md): a required check that only ever
  # reports on a cron would make every PR permanently unmergeable.
  advisories:
    name: bun audit (advisories on a clock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install deps
        run: bun install --frozen-lockfile

      # Two runs on purpose. `--json` is the machine-readable count (advisories
      # keyed by package, and nothing else). The plain run is what a human
      # reads, and it is the only output that names the dependency PATH — which
      # direct dependency drags a vulnerable transitive package in. That is the
      # difference between "a Dependabot PR fixes this" and "someone has to add
      # an `overrides` entry", and no bot in this repo does the second one.
      - name: Audit the lockfile
        id: audit
        env:
          NO_COLOR: "1"
        run: |
          set -uo pipefail
          bun audit --json > advisories.json 2> audit-error.txt
          json_status=$?
          bun audit > audit.txt 2>&1 || true

          if jq -e 'type == "object"' advisories.json > /dev/null 2>&1; then
            count="$(jq '[.[] | length] | add // 0' advisories.json)"
            packages="$(jq 'keys | length' advisories.json)"
          elif [ "$json_status" -eq 0 ]; then
            # Exit 0 with no JSON body: nothing to report.
            count=0
            packages=0
          else
            # A failed scan is not a clean lockfile. Fail loudly instead of
            # closing the advisory issue on the strength of a network error.
            echo "::error::bun audit produced no parseable JSON — the scan failed"
            cat audit-error.txt || true
            exit 1
          fi

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          printf '%s advisories across %s packages\n' "$count" "$packages" >> "$GITHUB_STEP_SUMMARY"

      # `${{ github.* }}` is expanded into `env:` and read back as a quoted
      # shell variable, never interpolated into the script body: an expansion
      # inside `run:` is the template-injection class zizmor fails at high
      # severity.
      - name: Open, refresh or close the advisory issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: "Dependency advisories on main (bun audit)"
          COUNT: ${{ steps.audit.outputs.count }}
          PACKAGES: ${{ steps.audit.outputs.packages }}
        run: |
          set -uo pipefail

          # Labels first: `gh issue create --label` fails on a label that does
          # not exist, and these are the same two labels .github/dependabot.yml
          # puts on every dependency PR — one query finds the advisory and the
          # bumps that answer it.
          gh label create dependencies --color 0366d6 \
            --description "Dependency updates and advisories" 2> /dev/null || true
          gh label create security --color d93f0b \
            --description "Security-relevant; a human reads this before it merges" 2> /dev/null || true

          # Deduped on the exact title, over open issues carrying the label —
          # not through the search index, which lags behind issue creation.
          existing="$(gh issue list --state open --label dependencies --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"

          if [ "$COUNT" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "bun audit came back clean on main. Run: $RUN_URL"
            fi
            exit 0
          fi

          {
            printf '`bun audit` reports **%s advisories** across **%s packages** on `main`.\n\n' \
              "$COUNT" "$PACKAGES"
            printf 'No build fails over this — the issue *is* the alarm, and it closes itself\n'
            printf 'when the scan comes back clean.\n\n'
            printf 'Triage: a vulnerable **direct** dependency is a Dependabot PR away. A\n'
            printf 'vulnerable **transitive** one needs a `package.json` `overrides` entry, which\n'
            printf 'no bot in this repo will write for you. The dependency paths below say which\n'
            printf 'is which.\n\n'
            printf 'Latest scan: %s\n\n' "$RUN_URL"
            printf '```\n'
            head -c 50000 audit.txt
            printf '\n```\n'
            printf '\n<!-- advisory-count: %s -->\n' "$COUNT"
          } > body.md

          if [ -n "$existing" ]; then
            # Refresh the body every day so it is never stale, but only comment
            # when the count moves. A daily comment on an issue nobody has fixed
            # yet is how a useful notification becomes a filtered one.
            previous="$(gh issue view "$existing" --json body --jq .body \
              | sed -n 's/.*advisory-count: \([0-9]*\).*/\1/p' | head -1)"
            gh issue edit "$existing" --body-file body.md \
              --add-label dependencies --add-label security
            if [ "$previous" != "$COUNT" ]; then
              gh issue comment "$existing" \
                --body "Advisory count moved: ${previous:-unknown} -> $COUNT. Refreshed body above. Run: $RUN_URL"
            fi
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md \
              --label dependencies --label security
          fi
