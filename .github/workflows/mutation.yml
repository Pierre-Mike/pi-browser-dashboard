name: Mutation tests

# Weekly, not per-PR: a mutation run is minutes, not seconds. Line coverage says
# a line ran; a surviving mutant says nothing asserted its behaviour. Scoped to
# *.core.ts — pure, so every mutant is deterministic.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: stryker (functional cores)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Mutation run
        run: bun run test:mutation
